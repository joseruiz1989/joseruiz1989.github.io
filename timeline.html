<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description"
		content="Jose Ruiz – Career and academic timeline covering education, work experience, projects, and publications from 2007 to present.">
	<link rel="icon" href="img/favicon.png" type="image/png">
	<title>Timeline | Jose Ruiz</title>
	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="vendors/linericon/style.css">
	<link rel="stylesheet" href="css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/custom.css">

	<style>
		.header_area { background: rgba(15,14,23,.95) !important; border-bottom: 1px solid rgba(255,255,255,.08); }
		.header_area .navbar-brand img { filter: brightness(10); }
		.header_area .nav-link { color: rgba(255,255,255,.75) !important; }
		.header_area .nav-link:hover,
		.header_area .nav-item.active .nav-link { color: #a09bff !important; }
		.header_area .icon-bar { background: #fff !important; }

		body { background: #0f0e17; }

		.timeline-breadcrumb {
			background: linear-gradient(135deg, #1a1836 0%, #0d1b2a 100%);
			padding: 60px 0 30px;
			border-bottom: 1px solid rgba(255,255,255,.06);
		}
		.timeline-breadcrumb h2 { color: #fff; font-size: 36px; font-weight: 800; }
		.timeline-breadcrumb .page_link a { color: rgba(255,255,255,.5); }
		.timeline-breadcrumb .page_link a:hover { color: #a09bff; }

		#tl-loading {
			text-align: center;
			padding: 80px 20px;
			color: rgba(255,255,255,.4);
			font-size: 16px;
		}
		#tl-loading i { font-size: 40px; color: #766dff; display: block; margin-bottom: 14px; animation: spin 1s linear infinite; }
		@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
	</style>
</head>

<body>
	<!-- Shared header -->
	<div id="header-placeholder"></div>

	<!--================ Breadcrumb =================-->
	<div class="timeline-breadcrumb">
		<div class="container text-center">
			<h2>My Journey</h2>
			<div class="page_link" style="margin-top:10px;">
				<a href="index.html">Home</a>
				<a href="timeline.html">Timeline</a>
			</div>
		</div>
	</div>

	<!--================ Timeline Section =================-->
	<section class="timeline-section">
		<div class="container">
			<div class="timeline-header">
				<p>From Colombia to Brazil, Germany, Canada, and the Dominican Republic — a journey through research, engineering, and innovation.</p>

				<!-- Category filters -->
				<div class="timeline-filter-pills">
					<span class="tl-pill active" data-tl-filter="all">All</span>
					<span class="tl-pill" data-tl-filter="education">🎓 Education</span>
					<span class="tl-pill" data-tl-filter="work">💼 Work</span>
					<span class="tl-pill" data-tl-filter="project">🔬 Projects</span>
					<span class="tl-pill" data-tl-filter="publication">📄 Publications</span>
					<span class="tl-pill" data-tl-filter="award">🏆 Awards</span>
				</div>
			</div>

			<!-- Loading state -->
			<div id="tl-loading"><i class="fa fa-circle-o-notch"></i> Loading timeline…</div>

			<!-- Timeline wrapper (populated by JS) -->
			<div class="timeline-wrapper" id="tl-wrapper">
				<div class="timeline-line"></div>
			</div>
		</div>
	</section>

	<!--================ Footer =================-->
	<footer class="footer_area" style="background:#0a0914; border-top: 1px solid rgba(255,255,255,.07);">
		<div class="container">
			<div class="row footer_bottom justify-content-center">
				<p class="col-lg-8 col-sm-12 footer-text" style="color:rgba(255,255,255,.4);">
					Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | Template by
					<a href="https://colorlib.com" target="_blank" style="color:#766dff;">Colorlib</a>
				</p>
			</div>
		</div>
	</footer>

	<!-- Scripts -->
	<script src="js/jquery-3.2.1.min.js"></script>
	<script src="js/popper.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/stellar.js"></script>
	<script src="js/theme.js"></script>
	<script src="js/csv-loader.js"></script>
	<script src="js/header.js"></script>
	<script>renderHeader('timeline');</script>

	<script>
	// ============================================================
	// Category meta (icon / badge label / css class)
	// ============================================================
	var CAT_META = {
		education:   { emoji: '🎓', label: 'Education',   css: 'cat-education' },
		work:        { emoji: '💼', label: 'Work',        css: 'cat-work' },
		project:     { emoji: '🔬', label: 'Project',     css: 'cat-project' },
		publication: { emoji: '📄', label: 'Publication', css: 'cat-publication' },
		award:       { emoji: '🏆', label: 'Award / Recognition', css: 'cat-award' }
	};

	// ============================================================
	// Build one timeline item from a CSV row
	// ============================================================
	function buildTLItem(row) {
		var cat = row.category || 'work';
		var meta = CAT_META[cat] || { emoji: '📌', label: cat, css: 'cat-work' };

		var yearEnd = row.year_end && row.year_end !== row.year ? row.year_end : '';
		var durationDisplay = row.duration_label || (yearEnd ? row.year + ' – ' + yearEnd : row.year);

		return '<div class="tl-item" data-tl-cat="' + cat + '">' +
			'<div class="tl-side">' +
				'<div class="tl-year">' + row.year + '</div>' +
				'<div class="tl-duration">' + durationDisplay + '</div>' +
			'</div>' +
			'<div class="tl-dot"><div class="tl-dot-inner"></div></div>' +
			'<div class="tl-card">' +
				'<span class="tl-category ' + meta.css + '">' + meta.emoji + ' ' + meta.label + '</span>' +
				'<h4>' + row.title + '</h4>' +
				'<div class="tl-org">' + row.organization + '</div>' +
				'<p>' + row.description + '</p>' +
				'<div class="tl-country-badge"><i class="fa fa-map-marker"></i> ' + row.country_emoji + ' ' + row.country_name + '</div>' +
			'</div>' +
		'</div>';
	}

	// ============================================================
	// Category filter
	// ============================================================
	var activeFilter = 'all';

	function applyTLFilter() {
		document.querySelectorAll('.tl-item').forEach(function(item) {
			var cat = item.getAttribute('data-tl-cat');
			item.style.display = (activeFilter === 'all' || cat === activeFilter) ? 'flex' : 'none';
		});
	}

	function initTLFilters() {
		document.querySelectorAll('.tl-pill').forEach(function(pill) {
			pill.addEventListener('click', function() {
				document.querySelectorAll('.tl-pill').forEach(function(p) { p.classList.remove('active'); });
				this.classList.add('active');
				activeFilter = this.getAttribute('data-tl-filter');
				applyTLFilter();
			});
		});
	}

	// ============================================================
	// Scroll-animation observer
	// ============================================================
	function initScrollObserver() {
		if (!window.IntersectionObserver) return;
		var observer = new IntersectionObserver(function(entries) {
			entries.forEach(function(entry) {
				if (entry.isIntersecting) {
					entry.target.classList.add('visible');
					observer.unobserve(entry.target);
				}
			});
		}, { threshold: 0.15 });

		document.querySelectorAll('.tl-item').forEach(function(item) {
			observer.observe(item);
		});
	}

	// ============================================================
	// Load CSV and render
	// ============================================================
	CSVLoader.load('data/timeline.csv').then(function(rows) {
		var wrapper = document.getElementById('tl-wrapper');
		var loading = document.getElementById('tl-loading');
		if (loading) loading.style.display = 'none';

		var html = '';
		rows.forEach(function(row) {
			if (row.id) html += buildTLItem(row);
		});

		// Append items inside wrapper (after the .timeline-line div)
		var line = wrapper.querySelector('.timeline-line');
		var temp = document.createElement('div');
		temp.innerHTML = html;
		while (temp.firstChild) {
			wrapper.appendChild(temp.firstChild);
		}

		initTLFilters();
		applyTLFilter();
		initScrollObserver();
	}).catch(function(err) {
		var loading = document.getElementById('tl-loading');
		if (loading) loading.innerHTML = '<i class="fa fa-exclamation-triangle" style="color:#e74c3c;animation:none;"></i> Error loading timeline. Please check data/timeline.csv';
		console.error(err);
	});
	</script>
</body>

</html>
